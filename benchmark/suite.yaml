schema_version: "1.0"
suite_id: "a100_scheduling_baselines_v1"
environment:
  root: "../environment"
  protocol: "../environment/protocol.yaml"
  freeze_lock: "../environment/FROZEN_SHA256SUMS"
  configs:
    train: "../environment/configs/natural_train.yaml"
    val: "../environment/configs/natural_val.yaml"
  output_root: "../runs/scheduling_baselines"
  test_policy: "locked"
resources:
  simulator_device: "cpu"
  policy_device: "auto"
  independent_workers: 2
  threads_per_worker: 4
randomness:
  master_seed: 17
  deterministic_seed_derivation: "master_seed_identity_v1"
  stochastic_seed_count: 3
  stochastic_seed_derivation: "numpy_seedsequence_spawn_uint32_v1"
deterministic_execution:
  epochs: 0
  iterations: 0
  complete_replays_per_split: 1
  full_seed_repetitions: 1
  expected_seed_variance: 0
comparison:
  primary_metric: "useful_spot_gpu_hours_score_raw"
  service_metric: "hp_gang_violation_rate"
  service_violation_limit: 0.02
baselines:
