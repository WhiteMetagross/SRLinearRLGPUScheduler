schema_id: "research_sim_unified_control_action"
version: "4.0"
space: "Box(low=-1, high=1, shape=(7,), dtype=float32)"
cadence_seconds: 300
fields:
  quota_delta_fraction:
    index: 0
    semantics: "Normalized residual scaled by max_quota_delta_fraction and pool capacity."
  priority_weights:
    indices: [1, 2, 3, 4, 5, 6]
    feature_order:
      - "queue_wait_squashed"
      - "gpu_per_worker_fraction"
      - "worker_fraction_of_nodes"
      - "total_gpu_demand_fraction"
      - "guarantee_fraction"
      - "estimated_duration_squashed"
quota_contract:
  base: "Causal GFS or declared external quota output computed before the action."
  max_quota_delta_fraction: 1.0
  bounds: "Executed quota is rounded and clipped to [0, pool capacity]."
admission_contract:
  score: "dot(priority_weights, causal_job_features)"
  ordering: "Descending score, then exact native GFS ordering."
zero_action: "Preserves base quota and native GFS admission ordering."
invalid_action_policy: "raise"
